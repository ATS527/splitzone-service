services:
  postgres-db:
    image: postgres:18-alpine
    container_name: splitzone-postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      APP_DB: ${APP_DB}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      TEST_APP_DB: ${TEST_APP_DB}
      TEST_APP_USER: ${TEST_APP_USER}
      TEST_APP_USER_PASSWORD: ${TEST_APP_USER_PASSWORD}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./container/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgres-dev-data:
