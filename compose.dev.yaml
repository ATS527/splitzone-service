services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: splitzone-oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_DATABASE}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      TEST_APP_USER: ${TEST_APP_USER}
      TEST_APP_USER_PASSWORD: ${TEST_APP_USER_PASSWORD}
    volumes:
      - oracle-dev-data:/opt/oracle/oradata
      - ./container/oracle/initdb:/container-entrypoint-initdb.d:ro
    user: "54321:54321"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-dev-data:
